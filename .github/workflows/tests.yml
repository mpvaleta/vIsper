name: Testes

# Roda a suíte inteira a cada push. É barato (Linux, segundos) e serve
# de rede de segurança: qualquer mudança que quebre a lógica do vIsper
# aparece aqui antes de virar problema num Mac.
#
# Os testes rodam SEM nenhuma dependência NATIVA de propósito — cada
# arquivo de teste dubla o que precisa de hardware (sounddevice, rumps,
# faster_whisper). Duas bibliotecas puras continuam sendo necessárias
# de verdade: numpy (testes de áudio) e requests (relay_listener e
# quem o importa, incluindo main.py).
#
# Esta lista é curta de propósito e não é `-r requirements.txt`: manter
# o mínimo aqui é o que garante que os dublês continuem cobrindo tudo
# que depende de hardware. Se um teste novo passar a exigir outra
# biblioteca, é sinal pra checar se ele não deveria estar mockando algo.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar o mínimo
        run: pip install numpy==1.26.4 requests==2.32.3

      - name: Rodar os testes
        run: python -m unittest discover -p "test_*.py" -v

      - name: Conferir que nenhum segredo escapou pro repositório
        # O repo é público e o NTFY_TOPIC é o que impede qualquer pessoa
        # de disparar automação no Mac dela. Config pessoal mora em
        # ~/Library/Application Support/vIsper/settings.json, fora daqui
        # — este check existe pra garantir que continue assim.
        run: python check_no_secrets.py

  pwa:
    # O app de iPhone (docs/) roda num navegador DE VERDADE aqui, não
    # em mock — o que o torna a peça mais validada do projeto. Cobre o
    # contrato com dictation.py (a string "<wake> <ia> <texto> over"),
    # a leitura do link de configuração e o comportamento de erro.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar o Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Rodar os testes do app de iPhone
        run: node test_pwa.js
