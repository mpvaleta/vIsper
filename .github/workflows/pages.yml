name: Publicar o app de iPhone

# Publica docs/ no GitHub Pages, que é o que faz o app de iPhone
# existir num endereço de verdade:
#
#   https://mpvaleta.github.io/vIsper/
#
# Ela abre isso no Safari do iPhone, faz Compartilhar → Adicionar à
# Tela de Início, e ganha um ícone que se comporta como app — sem
# Xcode, sem conta de desenvolvedor, sem expirar em 7 dias. Grátis em
# repositório público.
#
# LIGAR O PAGES É UM CLIQUE MANUAL, UMA VEZ SÓ:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# O `enablement: true` abaixo tenta ligar sozinho, mas o token do CI não
# tem permissão de administrador do repositório ("Resource not
# accessible by integration") — só a dona do repositório consegue. Por
# isso o passo é tolerante a falha: enquanto o Pages estiver desligado,
# este workflow termina VERDE e imprime o que clicar, em vez de ficar
# vermelho pra sempre por algo que não é um defeito do código. Depois
# do clique, ele publica sozinho a cada push.

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que está no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ligar o Pages se ainda não estiver ligado
        id: configurar
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explicar o que falta, se o Pages ainda estiver desligado
        if: steps.configurar.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages ainda não está ligado::\
          Abra Settings → Pages → Source e escolha 'GitHub Actions'. \
          Depois disso o app de iPhone publica sozinho a cada push."
          {
            echo "## O app de iPhone ainda não está no ar"
            echo
            echo "Falta um clique — e só a dona do repositório pode dar:"
            echo
            echo "1. **Settings** → **Pages**"
            echo "2. Em *Build and deployment* → *Source*, escolha **GitHub Actions**"
            echo "3. Volte na aba Actions e clique em *Re-run all jobs* aqui"
            echo
            echo "Depois disso vai ficar em:"
            echo '`https://mpvaleta.github.io/vIsper/`'
            echo
            echo "O token do CI não tem permissão de administrador do"
            echo "repositório, então não consegue ligar isso sozinho."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Empacotar docs/
        if: steps.configurar.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar
        id: deploy
        if: steps.configurar.outcome == 'success'
        uses: actions/deploy-pages@v4
